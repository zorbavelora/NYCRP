<style>
/* Layout: a violet spring night in Seoul. Monogram and nav down the left; the home page opens on a sakura-lit hero with panels resting below it; record pages are framed portraits beside a bound ledger */
:root{
  --bg:#110b19; --bg-2:#170f22; --panel:#1b1328; --panel-2:#241a34; --glass:rgba(27,19,40,.8);
  --line:#352847; --line-2:#523e6d; --ink:#f3eaf6; --mist:#c3b3d1; --dim:#8e7da1;
  --wine:#5a2d8c; --wine-2:#7a45b3; --rose:#f4a6c8; --gold:#e9bfe0; --gold-2:#a27fc0; --ok:#8fcfae; --shadow:rgba(5,0,15,.6);
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;
  --f-body:"Cormorant Garamond",Garamond,Georgia,serif;
  --f-script:"Pinyon Script","Snell Roundhand",cursive;
  color-scheme:dark;
}
:root[data-mood="light"]{
  --bg:#f8f1f8; --bg-2:#f0e4f2; --panel:#fffafe; --panel-2:#f6ebf7; --glass:rgba(255,250,254,.88);
  --line:#e6d4ea; --line-2:#cdb2d9; --ink:#2c1c3b; --mist:#6f5b82; --dim:#9a87ab;
  --wine:#6a3aa2; --wine-2:#8250bd; --rose:#c63f7f; --gold:#9b4d8f; --gold-2:#c39acb; --ok:#3d7a5a; --shadow:rgba(90,50,110,.18);
  color-scheme:light;
}
/* Alternative palette: the candlelit gothic theme (wine and antique gold), chosen per viewer with the theme button */
:root[data-palette="gothic"]{
  --bg:#0c0708; --bg-2:#130b0d; --panel:#170e10; --panel-2:#1f1315; --glass:rgba(22,12,14,.8);
  --line:#38222a; --line-2:#5a353c; --ink:#ece2d6; --mist:#b4a49c; --dim:#7f6c68;
  --wine:#6d1421; --wine-2:#8e2333; --rose:#cf6a7c; --gold:#c9a66b; --gold-2:#8d744a; --ok:#86ad86; --shadow:rgba(0,0,0,.6);
  color-scheme:dark;
}
:root[data-palette="gothic"][data-mood="light"]{
  --bg:#ede3d5; --bg-2:#e4d6c4; --panel:#f8f1e6; --panel-2:#f0e4d3; --glass:rgba(248,241,230,.9);
  --line:#d6c1a9; --line-2:#b99d7f; --ink:#2a1619; --mist:#6a5450; --dim:#8f7a73;
  --wine:#7a1a28; --wine-2:#93263a; --rose:#a8384f; --gold:#8a6526; --gold-2:#b0925a; --ok:#3d6b45; --shadow:rgba(70,40,25,.22);
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.55;font-variant-numeric:lining-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:var(--rose);text-underline-offset:3px}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.ic{width:1em;height:1em;flex:none;vertical-align:-.12em}
.muted{color:var(--mist)}
.num{font-variant-numeric:lining-nums tabular-nums}
h1,h2,h3{text-wrap:balance}
.amb{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 70% -10%,color-mix(in srgb,var(--wine) 30%,transparent),transparent 55%),radial-gradient(ellipse at 0% 100%,color-mix(in srgb,var(--wine) 18%,transparent),transparent 50%)}

/* Shell */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:none;border-right:1px solid var(--line);background:linear-gradient(180deg,var(--bg-2),var(--bg));padding-block:26px 24px;padding-left:max(0px,env(safe-area-inset-left,0px));display:flex;flex-direction:column}
.side::-webkit-scrollbar{display:none}
.mono{display:block;margin:0 auto 26px;width:120px;color:var(--ink);text-decoration:none}
.mono svg{width:100%;height:auto;display:block}
.mono img{width:100%;height:auto;display:block}
.nav-g{margin-bottom:14px}
.nav-g h4{margin:0 0 4px;padding-left:28px;font-family:var(--f-display);font-weight:500;letter-spacing:.24em;font-size:10px;color:var(--dim);text-transform:uppercase}
.nav-i{display:flex;align-items:center;gap:14px;padding:9px 18px 9px 28px;color:var(--mist);text-decoration:none;font-size:17px;font-weight:500;position:relative}
.nav-i .ic{width:18px;height:18px;opacity:.8}
.nav-i:hover{color:var(--ink)}
.nav-i[aria-current="page"]{color:var(--ink);background:linear-gradient(90deg,color-mix(in srgb,var(--wine) 85%,transparent),color-mix(in srgb,var(--wine) 25%,transparent) 70%,transparent);border-radius:0 30px 30px 0;margin-right:14px}
.nav-i[aria-current="page"]::before{content:"";position:absolute;left:8px;top:50%;width:6px;height:6px;transform:translate(0,-50%) rotate(45deg);border:1px solid var(--gold-2)}
.nav-i b{margin-left:auto;font-weight:500;font-size:13px;color:var(--dim)}
.side-sep{height:1px;margin:10px 28px 16px;background:linear-gradient(90deg,transparent,var(--line-2),transparent)}
.me{margin-top:auto;padding:14px 28px 0;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--mist)}
.me img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1px solid var(--line-2)}
.main{min-width:0;display:flex;flex-direction:column;overflow-x:clip}
.chat{display:grid;grid-template-rows:minmax(0,1fr) auto;height:min(70vh,720px);min-height:360px;border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden}
.chat-log{overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;overscroll-behavior:contain}
.msg{position:relative;display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;padding:3px 6px;border-radius:4px}
.msg:not(.g){margin-top:12px}
.msg:hover{background:var(--panel-2)}
.msg .av{width:38px}
.msg .av img,.msg .av span{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid var(--gold-2);display:grid;place-items:center;background:var(--bg-2);font-family:var(--f-display);font-size:13px}
.mh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.mh strong{font-weight:700;color:var(--gold)}
.mh time{font-size:13px;color:var(--dim)}
.msg p{margin:0;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.45}
.mx{opacity:0;background:none;border:none;color:var(--dim);cursor:pointer;padding:4px;align-self:start}
.mx .ic{width:14px;height:14px}
.msg:hover .mx,.mx:focus-visible,.mx.armed{opacity:1}
.mx.armed{color:var(--rose)}
.chat-in{display:flex;gap:10px;align-items:flex-end;padding:12px 14px;border-top:1px solid var(--line);background:var(--panel-2)}
.chat-in textarea{flex:1;min-width:0;resize:none;min-height:42px;max-height:140px;box-sizing:border-box}
.hrow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.hrow:last-child{border-bottom:none}
.hrow .ic{width:20px;height:20px;color:var(--pc,var(--rose))}
.hrow strong{font-weight:600;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow time{font-size:14px;color:var(--dim);white-space:nowrap}
.hero-t.solo{font-size:clamp(72px,12vw,170px);letter-spacing:.14em;line-height:.9;padding-left:.14em}
.topbar{position:relative;z-index:6;display:flex;justify-content:flex-end;align-items:center;gap:14px;padding-block:22px 0;padding-left:clamp(16px,3vw,44px);padding-right:max(16px,env(safe-area-inset-right,0px))}
.search{position:relative;width:min(320px,100%)}
.search input{width:100%;box-sizing:border-box;border-radius:30px;padding:10px 16px 10px 42px;background:var(--glass);border:1px solid var(--line-2);color:var(--ink);font-family:var(--f-body);font-size:16px;backdrop-filter:blur(6px)}
.search .ic{position:absolute;z-index:1;pointer-events:none;left:15px;top:50%;transform:translateY(-50%);color:var(--mist);width:17px;height:17px}
.sres{position:absolute;right:0;top:calc(100% + 8px);width:min(420px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line-2);box-shadow:0 20px 50px var(--shadow);max-height:60vh;overflow:auto;z-index:20}
.sres a{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.sres a:hover{background:var(--panel-2)}
.sres small{color:var(--dim);font-family:var(--f-display);font-size:10px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.moon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:transparent;border:1px solid transparent;color:var(--mist);cursor:pointer}
.moon:hover{border-color:var(--line-2);color:var(--ink)}
.moon .ic{width:22px;height:22px}
.content{flex:1;padding-left:clamp(16px,3vw,44px);padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.home .content{padding-top:0}

/* Footer */
.foot{border-top:1px solid var(--line);padding-block:20px;padding-left:clamp(16px,3vw,44px);padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;background:var(--bg-2)}
.socials{display:flex;gap:18px}
.socials a{color:var(--mist)}
.socials a:hover{color:var(--ink)}
.socials .ic{width:22px;height:22px}
.foot-mid{display:flex;align-items:center;gap:14px;font-family:var(--f-display);font-size:11px;letter-spacing:.42em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.foot-r{justify-self:end;font-size:14px;color:var(--dim);text-align:right}

/* Ornaments & type */
.orn{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold-2)}
.orn::before,.orn::after{content:"";height:1px;width:min(110px,22vw);background:linear-gradient(90deg,transparent,currentColor)}
.orn::after{transform:scaleX(-1)}
.orn .ic{width:16px;height:16px;color:var(--gold)}
.eyebrow{font-family:var(--f-display);font-weight:500;letter-spacing:.32em;font-size:12px;color:var(--mist);text-transform:uppercase}
.h-page{font-family:var(--f-display);font-weight:500;font-size:clamp(28px,3.6vw,42px);line-height:1.1;margin:4px 0 0;letter-spacing:.03em}
.script{font-family:var(--f-script);font-weight:400;color:var(--rose);letter-spacing:0}
.ph-head{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;margin:10px 0 22px}
.ph-head .t{flex:1 1 260px;min-width:0}
.count{font-size:15px;color:var(--dim);font-style:italic}
.sec-h{display:flex;align-items:center;gap:12px;margin:40px 0 16px;font-family:var(--f-display);font-weight:500;font-size:19px;letter-spacing:.06em}
.sec-h .ic{width:20px;height:20px;color:var(--gold)}
.sec-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:clamp(16px,2.4vw,26px);box-shadow:0 18px 40px -26px var(--shadow)}
.empty h3{font-family:var(--f-display);font-weight:500;font-size:22px;margin:0 0 8px}
.empty p{max-width:62ch;margin:0 0 14px;color:var(--mist)}
.notice{border:1px dashed var(--line-2);border-radius:6px;padding:10px 14px;margin-bottom:18px;color:var(--mist)}
.notice.err{border-color:var(--rose);color:var(--rose)}

/* Controls */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filters input[type=search]{flex:1 1 220px;min-width:0}
.in{font-family:var(--f-body);font-size:16px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px 11px;max-width:100%}
.in:focus{border-color:var(--gold-2);outline:none}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.qchip{font-family:var(--f-body);font-weight:600;font-size:15px;padding:3px 14px;border:1px solid var(--line);border-radius:20px;background:transparent;color:var(--mist);cursor:pointer}
.qchip b{font-weight:500;margin-left:6px;color:var(--dim)}
.qchip[aria-pressed="true"]{border-color:var(--gold-2);color:var(--ink);background:color-mix(in srgb,var(--wine) 45%,transparent)}
.btn{font-family:var(--f-display);font-weight:500;letter-spacing:.12em;font-size:12px;text-transform:uppercase;padding:10px 18px;border:1px solid var(--line-2);border-radius:3px;background:var(--panel-2);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--gold-2)}
.btn.primary{background:linear-gradient(180deg,var(--wine-2),var(--wine));border-color:color-mix(in srgb,var(--gold) 45%,var(--wine));color:#fff4fb;box-shadow:0 0 0 3px var(--bg),0 0 0 4px color-mix(in srgb,var(--gold) 35%,transparent)}
.btn.gold{background:transparent;border-color:var(--gold-2);color:var(--gold)}
.btn.danger{background:transparent;border-color:var(--rose);color:var(--rose)}
.btn.danger.armed{background:var(--rose);color:var(--bg)}
.btn.small{padding:6px 11px;font-size:10px;letter-spacing:.12em}
.btn:disabled{opacity:.45;cursor:default}
.linkish{background:none;border:none;padding:0;font:inherit;color:var(--rose);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-block;font-weight:600;font-size:13px;border:1px solid var(--line-2);border-radius:20px;padding:0 9px;color:var(--mist);line-height:1.6;white-space:nowrap}
.chip.gold{border-color:var(--gold-2);color:var(--gold)}
.chip.rose{border-color:var(--rose);color:var(--rose)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-block;font-size:13px;padding:1px 9px;border-radius:3px;background:color-mix(in srgb,var(--wine) 70%,transparent);color:#fbe9f4;white-space:nowrap}
.lv{font-family:var(--f-display);font-weight:600;letter-spacing:.1em;font-size:11px;text-transform:uppercase}
.lv-0{color:var(--mist)}.lv-1{color:var(--gold)}.lv-2{color:var(--rose)}.lv-3{color:#ff7aa8}.lv-4{color:#b98be0}
.badge{font-family:var(--f-display);font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border:1px solid currentColor;border-radius:3px;white-space:nowrap}
.b-rose{color:var(--rose)}.b-gold{color:var(--gold)}.b-dim{color:var(--mist)}.b-ok{color:var(--ok)}
.seal-mark{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e98ab6,#7a3a8f 70%);color:#fff0f7;font-family:var(--f-display);font-weight:700;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.5),inset 0 -3px 6px rgba(0,0,0,.35)}

/* Hero */
.hero{position:relative;margin-top:-62px;min-height:560px;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:center;padding:96px 0 120px;overflow:visible}
.hero-bg{position:absolute;inset:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * clamp(16px,3vw,44px));overflow:hidden;z-index:0;background:#140c22}
.hero-bg>svg,.hero-bg>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(17,11,25,.05),rgba(17,11,25,.35) 75%),linear-gradient(180deg,rgba(17,11,25,.2) 0%,transparent 40%,var(--bg) 100%)}
.petals{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.petals i{position:absolute;top:-24px;width:13px;height:10px;border-radius:80% 0 80% 0;background:radial-gradient(ellipse at 30% 30%,#fff3f8,#f4a6c8 70%);opacity:.85;transform:scale(var(--s,1));animation:fall 12s linear infinite}
@keyframes fall{0%{transform:translate(0,-24px) rotate(0deg) scale(var(--s,1))}50%{transform:translate(calc(var(--dx,60px)*.4),330px) rotate(260deg) scale(var(--s,1))}100%{transform:translate(var(--dx,60px),720px) rotate(560deg) scale(var(--s,1))}}
.flick{animation:flick 3.2s ease-in-out infinite alternate}
.flick.b{animation-duration:2.4s;animation-delay:.6s}
@keyframes flick{0%{opacity:.75}40%{opacity:1}70%{opacity:.82}100%{opacity:.95}}
.hero-c{position:relative;z-index:2;text-align:center;color:#f8eefa;display:grid;justify-items:center;gap:14px;min-width:0}
.hero-c .eyebrow{color:#dcc8e6}
.hero-c .orn{color:#e2a3c9}
.hero-t{margin:0;font-family:var(--f-display);font-weight:500;font-size:clamp(34px,5.4vw,66px);line-height:1.02;letter-spacing:.02em;text-shadow:0 4px 30px rgba(0,0,0,.7)}
.hero-t .script{display:block;font-size:1.32em;line-height:.95;color:#f4a6c8;text-shadow:0 2px 20px rgba(0,0,0,.6);margin-top:.05em}
.hero-p{max-width:46ch;margin:0;font-size:clamp(17px,1.6vw,20px);color:#e2d3ea;line-height:1.5}
.cta{position:relative;margin-top:10px;padding:13px 38px;font-family:var(--f-body);font-size:19px;font-weight:600;letter-spacing:.02em;color:#fff4fb;background:linear-gradient(180deg,#7a45b3,#4b2479);border:1px solid #e2a3c9;border-radius:4px;cursor:pointer;display:inline-flex;gap:10px;align-items:center;text-decoration:none;box-shadow:0 0 0 4px rgba(17,11,25,.6),0 0 0 5px rgba(244,166,200,.45),0 10px 30px rgba(0,0,0,.5)}
.cta:hover{background:linear-gradient(180deg,#8a55c4,#5a2d8c)}
.cta::before,.cta::after{content:"";position:absolute;top:50%;width:10px;height:10px;border:1px solid #e2a3c9;transform:translateY(-50%) rotate(45deg);background:#2a1640}
.cta::before{left:-11px}.cta::after{right:-11px}
.online{position:relative;z-index:2;align-self:start;margin-top:80px;background:rgba(24,15,36,.82);border:1px solid #4d3a6b;border-radius:8px;padding:16px;color:#f1e6f5;backdrop-filter:blur(4px)}
.online h3{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;font-family:var(--f-body);font-weight:600;font-size:17px;padding-bottom:10px;border-bottom:1px solid #3a2c50}
.online h3 span{font-size:14px;display:flex;align-items:center;gap:6px;color:#dcc8e6}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5fbf75;box-shadow:0 0 6px #5fbf75}
.ou{display:flex;align-items:center;gap:12px;padding:7px 0;font-size:16px}
.ou .av{position:relative;width:36px;height:36px;flex:none}
.ou .av img,.ou .av span{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid #6b5288;display:grid;place-items:center;background:#2a1d3d;font-size:13px}
.ou .av i{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:#5fbf75;border:2px solid #140c22}
.ou small{margin-left:auto;color:#a898b8;font-size:13px}
.home-panels{position:relative;z-index:3;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:-90px}
.hp{background:var(--glass);border:1px solid var(--line);border-radius:6px;padding:18px 20px;backdrop-filter:blur(6px);box-shadow:0 18px 40px -24px var(--shadow);min-width:0}
.hp-h{display:flex;align-items:center;gap:12px;padding-bottom:12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.hp-h h2{margin:0;font-family:var(--f-body);font-weight:500;font-size:24px;flex:1}
.hp-h .ic{width:24px;height:24px;color:var(--gold)}
.hp-h a{font-size:15px;color:var(--mist);text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.hp-h a:hover{color:var(--ink)}
.ann{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.ann:last-child{border-bottom:none}
.ann .th{aspect-ratio:16/10;max-width:100%;border-radius:3px;overflow:hidden;background:linear-gradient(135deg,var(--panel-2),var(--bg-2));display:grid;place-items:center;color:var(--gold-2)}
.ann .th img{width:100%;height:100%;object-fit:cover}
.ann .th .ic{width:26px;height:26px}
.ann-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ann-top strong{font-weight:600;font-size:18px;flex:1;min-width:0}
.ann-top time{font-size:15px;color:var(--mist)}
.ann p{margin:4px 0 0;font-size:16px;color:var(--mist);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trow{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.trow:last-child{border-bottom:none}
.trow:hover{background:color-mix(in srgb,var(--panel-2) 60%,transparent)}
.trow .ic{width:22px;height:22px;color:var(--dim)}
.trow strong{font-weight:500;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow time{font-size:14px;color:var(--dim);white-space:nowrap}
.rc{min-width:28px;text-align:center;font-size:14px;font-weight:600;padding:1px 8px;border-radius:4px;background:color-mix(in srgb,var(--wine) 75%,transparent);color:#fbe9f4}
.strip{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 26px;margin:36px 0 6px;font-family:var(--f-display);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.strip b{color:var(--gold);font-weight:600;margin-right:6px}

/* Portrait frames */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px 18px}
.port{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;text-decoration:none;color:inherit;gap:10px}
.frame{position:relative;width:100%;aspect-ratio:3/4;max-width:100%;padding:7px;border-radius:50% 50% 6px 6px/24% 24% 6px 6px;background:linear-gradient(160deg,#d9b7e6,#6e4f8c 40%,#f2c6dc 70%,#5b3f78);box-shadow:0 14px 30px -14px var(--shadow)}
.frame-in{position:relative;width:100%;height:100%;border-radius:50% 50% 3px 3px/24% 24% 3px 3px;overflow:hidden;background:var(--bg-2);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
.frame-in img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.28) saturate(.75) contrast(1.05) brightness(.85);transition:filter .5s,transform .6s}
.frame-in::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,transparent 45%,rgba(17,8,28,.6) 100%);pointer-events:none}
.port:hover .frame-in img{filter:sepia(.1) saturate(.95) contrast(1.05) brightness(.95);transform:scale(1.03)}
.ph-none{width:100%;height:100%;display:grid;place-content:center;justify-items:center;gap:6px;font-family:var(--f-display);font-size:10px;letter-spacing:.24em;color:var(--dim)}
.ph-none b{font-family:var(--f-display);font-weight:500;font-size:40px;letter-spacing:.04em;color:var(--line-2)}
.port .pname{font-family:var(--f-display);font-weight:500;font-size:17px;letter-spacing:.04em;line-height:1.2}
.port .pcode{font-family:var(--f-script);font-size:22px;color:var(--rose);line-height:1}
.port .pmeta{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mist)}
.fileno{position:absolute;z-index:2;top:14%;left:50%;transform:translateX(-50%);font-family:var(--f-display);font-size:10px;letter-spacing:.2em;color:#fbeaf5;background:rgba(17,11,25,.6);padding:1px 8px;border-radius:10px;white-space:nowrap}
.lockb{position:absolute;z-index:2;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;font-family:var(--f-display);font-size:10px;letter-spacing:.16em;background:var(--gold);color:#24123a;padding:1px 8px;border-radius:10px}
.stamp{display:inline-block;font-family:var(--f-display);font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#ff8fbf;border:2px double #ff8fbf;padding:2px 12px;font-size:13px;transform:rotate(-8deg);background:rgba(17,11,25,.6);white-space:nowrap}
.frame-in .stamp{position:absolute;z-index:2;top:52%;left:50%;transform:translate(-50%,-50%) rotate(-10deg)}
.port.sealed .frame-in{background:radial-gradient(circle at 50% 40%,var(--panel-2),var(--bg))}
.port.example{pointer-events:none;opacity:.75}
.exlabel{position:absolute;z-index:3;top:4px;right:4px;font-family:var(--f-display);font-size:10px;letter-spacing:.14em;background:var(--ink);color:var(--bg);padding:1px 7px;border-radius:10px}
.redact-bar{display:inline-block;background:var(--ink);height:.85em;vertical-align:-.05em;border-radius:1px}

/* Record page */
.crumbs{font-family:var(--f-display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:8px 0 16px}
.crumbs a{color:var(--mist);text-decoration:none}
.book{display:grid;grid-template-columns:minmax(240px,36%) minmax(0,1fr);gap:clamp(20px,3vw,44px);align-items:start}
.book-l{position:sticky;top:20px;display:grid;gap:16px;justify-items:center}
.book-l .frame{width:min(100%,360px)}
.candle{position:absolute;inset:-30px 0 auto;height:60%;background:radial-gradient(ellipse at 50% 0%,rgba(244,166,200,.18),transparent 70%);pointer-events:none;z-index:-1}
.book-r{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-content:start}
.r-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.r-name{font-family:var(--f-display);font-weight:500;font-size:clamp(32px,4.6vw,56px);line-height:1.05;margin:6px 0 2px;letter-spacing:.02em;overflow-wrap:anywhere}
.r-code{font-family:var(--f-script);font-size:clamp(28px,3vw,38px);color:var(--rose);line-height:1}
.r-actions{display:flex;gap:8px;flex-wrap:wrap}
.note-bar{display:flex;gap:10px;align-items:center;border:1px solid var(--line-2);border-left:3px solid var(--gold);border-radius:4px;padding:9px 14px;font-style:italic;font-size:17px;background:var(--panel)}
.ledger{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.ledger div{padding:9px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.ledger span{display:block;font-family:var(--f-display);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.ledger b{font-weight:600;overflow-wrap:anywhere}
.rs{border-top:1px solid var(--line);padding-top:18px}
.rs h3{margin:0 0 10px;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.rs h3 .ic{width:16px;height:16px}
.rs p{margin:0 0 12px;max-width:68ch}
.rs p:last-child{margin-bottom:0}
.prose>p:first-child::first-letter{float:left;font-family:var(--f-display);font-size:3.2em;line-height:.85;padding:6px 8px 0 0;color:var(--rose)}
.lead{font-size:20px;font-style:italic;color:var(--mist);margin:0}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.lnk{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:6px;padding:9px 12px;text-decoration:none;color:inherit;min-width:0;background:var(--panel)}
.lnk:hover{border-color:var(--gold-2)}
.lnk .t{flex:1;min-width:0}
.lnk strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk small{display:block;font-size:14px;color:var(--mist);font-style:italic}
.lnk>.ic{color:var(--dim)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.empty-i{font-style:italic;color:var(--dim);margin:0}
.redact{background:var(--ink);color:transparent;cursor:pointer;-webkit-user-select:none;user-select:none;padding:0 2px;border-radius:1px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.redact.shown{background:transparent;color:var(--rose);outline:1px dashed var(--rose)}
.redlink{color:var(--rose);border-bottom:1px dotted var(--rose);cursor:help}
.notes{background:var(--panel);border:1px dashed var(--line-2);border-radius:6px;padding:12px 16px;font-style:italic}
.repbar{position:relative;height:6px;background:var(--panel-2);border-radius:3px;margin:8px 0}
.repbar i{position:absolute;top:0;bottom:0;background:var(--gold);border-radius:3px}
.repbar::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--dim)}
.files{display:grid;gap:6px}
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:8px 12px;color:var(--ink);text-decoration:none;min-width:0;background:var(--panel);font:inherit;cursor:pointer;text-align:left}
.file:hover{border-color:var(--gold-2)}
.file span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.thumb{aspect-ratio:1;max-width:100%;overflow:hidden;border:1px solid var(--line);border-radius:4px;padding:0;background:var(--panel-2);cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover;filter:sepia(.2) brightness(.9)}
.locked-sheet{text-align:center;padding:70px 20px}
.locked-sheet .ic{width:46px;height:46px;color:var(--gold)}
.sealed-cover{display:grid;justify-items:center;gap:16px;text-align:center;padding:60px 20px}
.sealed-cover .seal-mark{width:90px;height:90px;font-size:26px}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table.tbl{width:100%;border-collapse:collapse;font-size:16px;min-width:620px}
.tbl th{font-family:var(--f-display);font-weight:500;letter-spacing:.16em;font-size:10px;text-transform:uppercase;text-align:left;color:var(--dim);border-bottom:1px solid var(--line-2);padding:11px 14px;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--line);padding:10px 14px;vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.who{display:inline-flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none}
.who:hover{color:var(--rose)}
.mini{width:30px;height:30px;flex:none;border-radius:50%;overflow:hidden;background:var(--panel-2);display:grid;place-items:center;font-family:var(--f-display);font-size:11px;color:var(--mist);border:1px solid var(--gold-2)}
.mini img{width:100%;height:100%;object-fit:cover;filter:sepia(.2)}

/* Generic cards */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.acard{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 14px 30px -22px var(--shadow)}
.acard:hover{border-color:var(--gold-2)}
.cimg{position:relative;aspect-ratio:16/10;max-width:100%;background:var(--panel-2);overflow:hidden}
.cimg img{width:100%;height:100%;object-fit:cover;filter:sepia(.25) saturate(.8) brightness(.85)}
.cimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,color-mix(in srgb,var(--panel) 80%,transparent))}
.abody{padding:12px 16px 16px;display:grid;gap:4px}
.abody h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:18px;letter-spacing:.03em}
.abody .sub{font-size:15px;color:var(--mist);font-style:italic}
.wide-plate{position:relative;border-radius:6px 6px 0 0;overflow:hidden;border:1px solid var(--line);border-bottom:none;aspect-ratio:21/9;max-width:100%;background:var(--panel-2)}
.wide-plate img{width:100%;height:100%;object-fit:cover;filter:sepia(.25) saturate(.8) brightness(.8)}
.plateno{display:inline-block;border:1px solid var(--gold-2);border-radius:4px;padding:6px 18px;font-family:var(--f-display);font-size:22px;letter-spacing:.24em}

/* Houses */
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.house{display:grid;grid-template-columns:76px minmax(0,1fr);gap:16px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;text-decoration:none;color:inherit;position:relative;overflow:hidden}
.house::before{content:"";position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--oc,#5a2d8c) 22%,transparent),transparent 45%);pointer-events:none}
.house:hover{border-color:var(--gold-2)}
.crest{position:relative;width:76px;height:88px;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);background:linear-gradient(180deg,var(--oc,#5a2d8c),color-mix(in srgb,var(--oc,#5a2d8c) 40%,#000));display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:22px;color:#fbeaf5;overflow:hidden}
.crest img{width:100%;height:100%;object-fit:cover}
.house h3{margin:2px 0 4px;font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:.03em}
.motto{font-family:var(--f-script);font-size:22px;color:var(--rose);margin:4px 0 0;line-height:1.1}

/* Contracts, cases */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.notice-card{display:grid;grid-template-columns:90px minmax(0,1fr);gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;text-decoration:none;color:inherit}
.notice-card:hover{border-color:var(--gold-2)}
.notice-card .frame{padding:4px}
.notice-card h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:18px}
.reward{font-family:var(--f-display);font-weight:600;font-size:19px;color:var(--gold);letter-spacing:.04em}
.timeline{list-style:none;padding:0;margin:0;border-left:1px solid var(--line-2)}
.timeline li{position:relative;padding:0 0 14px 22px}
.timeline li::before{content:"";position:absolute;left:-5px;top:9px;width:9px;height:9px;transform:rotate(45deg);background:var(--bg);border:1px solid var(--gold)}
.timeline time{font-size:14px;color:var(--dim);display:block;font-style:italic}

/* Stage */
.celebs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:24px 18px}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.clip{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:grid;min-width:0}
.clip-b{padding:14px 16px;display:grid;gap:7px}
.clip-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--dim)}
.plat{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--ink)}
.plat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc,var(--mist))}
.clip h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:18px;overflow-wrap:anywhere}
.clip p{margin:0;font-size:16px;color:var(--mist);overflow-wrap:anywhere}
.clip-f{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;font-size:15px}
.gala{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;padding:46px 20px 40px;text-align:center;margin-bottom:18px;background:radial-gradient(ellipse at 50% -10%,rgba(244,166,200,.22),transparent 55%),radial-gradient(ellipse at 50% 120%,color-mix(in srgb,var(--wine) 50%,transparent),transparent 60%),var(--panel)}
.gala h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:clamp(28px,4.4vw,52px);letter-spacing:.06em;color:var(--gold)}
.gala p{margin:8px 0 0;font-family:var(--f-script);font-size:28px;color:var(--rose)}
.awgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:36px}
.award{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px 16px 18px;text-align:center;display:grid;gap:6px;justify-items:center}
.award .ic{width:38px;height:38px;color:var(--gold);margin-bottom:6px}
.award .cat{font-family:var(--f-display);font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--gold)}
.award .win{font-family:var(--f-display);font-weight:600;font-size:19px;color:var(--ink);text-decoration:none}
.award a.win:hover{color:var(--rose)}
.award .yr{font-size:14px;color:var(--dim);font-style:italic}
.award .ed{position:absolute;top:6px;right:6px}
.altar{border:1px solid var(--line);border-radius:6px;padding:36px 20px;text-align:center;display:grid;justify-items:center;gap:12px;margin-bottom:28px;background:radial-gradient(ellipse at 50% 30%,color-mix(in srgb,var(--wine) 40%,transparent),transparent 65%),var(--panel)}
.cardback{width:110px;aspect-ratio:2/3;border-radius:8px;border:1px solid var(--gold-2);background:repeating-linear-gradient(45deg,var(--wine) 0 8px,color-mix(in srgb,var(--wine) 70%,#000) 8px 16px);display:grid;place-items:center;box-shadow:0 0 0 4px var(--panel),0 0 0 5px var(--gold-2),0 18px 40px -10px var(--shadow)}
.cardback .ic{width:38px;height:38px;color:var(--gold)}
.altar.spin .cardback{animation:flipb 1s ease-in-out}
@keyframes flipb{50%{transform:perspective(600px) rotateY(180deg) scale(1.08)}}
.pcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.pc{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:8px;border:1px solid var(--line-2);background:var(--panel-2);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.pc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:sepia(.15) saturate(.9)}
.pc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(17,11,25,.92));pointer-events:none}
.pc .rar{position:absolute;top:8px;right:8px;z-index:2;font-family:var(--f-display);font-size:9px;letter-spacing:.16em;text-transform:uppercase;padding:1px 7px;border-radius:10px;background:rgba(17,11,25,.75);border:1px solid currentColor}
.pc .nm{position:relative;z-index:2;padding:10px;font-family:var(--f-display);font-weight:500;font-size:15px;color:#f8eefa;text-align:center}
.pc .cnt{position:absolute;top:8px;left:8px;z-index:2;font-size:13px;background:#f8eefa;color:#24123a;padding:0 7px;border-radius:10px}
.r-Common{color:#c3b3d1}.r-Rare{color:#8fb0c9}.r-Epic{color:#c79be6}.r-Legendary{color:#e0bd75}
.pc.Legendary{border-color:#c9a66b;box-shadow:0 0 22px rgba(244,166,200,.3)}
.pc.Epic{border-color:#9d6fc2}
.reveal{position:fixed;inset:0;z-index:90;background:rgba(12,6,20,.9);display:grid;place-items:center;padding:20px}
.reveal .pc{width:min(280px,70vw);animation:flipin .7s ease-out}
@keyframes flipin{from{transform:perspective(800px) rotateY(90deg) scale(.8);opacity:0}}
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.board{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
.board h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:20px}
.lrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:none}
.lrank{font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--dim);text-align:center}
.lrow.top .lrank{color:var(--gold)}
.lbar{height:3px;background:var(--panel-2);margin-top:5px;border-radius:2px}
.lbar i{display:block;height:100%;background:var(--wine-2);border-radius:2px}
.lrow.top .lbar i{background:var(--gold)}
.lscore{font-weight:700;white-space:nowrap}

/* Map */
.map{position:relative;aspect-ratio:16/10;max-width:100%;border:1px solid var(--line-2);border-radius:6px;background:#0f0b1c;overflow:hidden;cursor:crosshair}
.map>svg,.map>img,.minimap>svg,.minimap>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.map>img,.minimap>img{filter:sepia(.35) brightness(.6) contrast(1.1)}
.pin{position:absolute;z-index:3;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;border:2px solid #0f0b1c;background:var(--pc,#f4a6c8);box-shadow:0 0 0 1px var(--pc,#f4a6c8),0 0 14px var(--pc,#f4a6c8);padding:0;cursor:pointer}
.pin.sq{border-radius:2px;transform:translate(-50%,-50%) rotate(45deg)}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const byId=(a,id)=>a.find(x=>x.id===id);

const canW=()=>!!DB&&S.canWrite!==false;
const initials=n=>String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toLocaleUpperCase('tr')||'?';

const lvl=(arr,v)=>Math.max(0,arr.indexOf(v));

function fmtD(d){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||'');return m?`${m[3]}.${m[2]}.${m[1]}`:esc(d||'');}
function ago(iso){if(!iso)return '';const t=Date.parse(iso);if(isNaN(t))return fmtD(iso);const s=(Date.now()-t)/1000;if(s<60)return 'az önce';if(s<3600)return `${Math.floor(s/60)} dk önce`;if(s<86400)return `${Math.floor(s/3600)} sa önce`;if(s<86400*7)return `${Math.floor(s/86400)} gün önce`;return fmtD(new Date(t).toISOString());}
function allTypes(){const s=new Set();S.chars.forEach(c=>(c.types||[]).forEach(t=>s.add(t)));return [...s].sort((a,b)=>a.localeCompare(b,'tr'));}

function img(id,alt,ph,pos){return `<img src="${esc(blob(id))}" alt="${esc(alt||'')}" loading="lazy" data-ph="${esc(ph||'')}"${pos?` style="object-position:${pos}"`:''}>`;}
// Portraits sit slightly above center by default so faces stay inside the arch; each character can adjust it.
const posOf=c=>`${c&&c.photoX!=null&&c.photoX!==''?+c.photoX:50}% ${c&&c.photoY!=null&&c.photoY!==''?+c.photoY:25}%`;
function photo(c){return c&&c.photo?img(c.photo,c.name,initials(c.name),posOf(c)):`<span class="ph-none"><b>${esc(initials(c&&c.name))}</b>PORTRE YOK</span>`;}
function cover(id,label){return id?img(id,label,initials(label)):`<span class="ph-none"><b>${esc(initials(label))}</b>GÖRSEL YOK</span>`;}
function frame(inner,extra=''){return `<div class="frame"><div class="frame-in">${inner}${extra}</div></div>`;}
function mini(c){return `<span class="mini">${c&&c.photo?`<img src="${esc(blob(c.photo))}" alt="" data-ph="${esc(initials(c.name))}" style="object-position:${posOf(c)}">`:esc(initials(c&&c.name))}</span>`;}
function who(id,fallback){const c=ch(id);if(!c)return fallback?esc(fallback):`<span class="muted">${id?'Silinmiş kayıt':'—'}</span>`;return `<a class="who" href="#k-${esc(c.id)}">${mini(c)}<span>${esc(c.classified?'Bilinmeyen':c.name)}</span></a>`;}

  if(m)out.push({o,role:m.role||(o.leaderId===cid?'Reis':'')});else if(o.leaderId===cid)out.push({o,role:'Reis'});else if(c&&c.orgId===o.id)out.push({o,role:''});});return out;}

function rich(t){
  if(!t)return '';
  let h=esc(t);
  h=h.replace(/\|\|([\s\S]+?)\|\|/g,(m,x)=>`<span class="redact" role="button" tabindex="0" title="Üstü kapalı. Görmek için tıkla.">${x}</span>`);
  h=h.replace(/\[\[([^\]\n]+?)\]\]/g,(m,x)=>{const k=low(x.trim());
    const c=S.chars.find(c=>[c.name,c.codename].some(n=>n&&low(esc(n))===k));if(c)return `<a href="#k-${esc(c.id)}">${x}</a>`;
    const o=S.comms.find(o=>o.name&&low(esc(o.name))===k);if(o)return `<a href="#t-${esc(o.id)}">${x}</a>`;
    return `<span class="redlink" title="Bu isimde bir kayıt yok">${x}</span>`;});
  return h.split(/\n{2,}/).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
}

}

function monogram(){
  if(S.settings.logo)return `<img src="${esc(blob(S.settings.logo))}" alt="${esc(S.settings.universe||'Logo')}">`;
  const u=String(S.settings.universe||'SEUL').trim();
  const t=String(S.settings.monogram||(/\s/.test(u)?initials(u):u)).slice(0,4);
  const petal=a=>`<ellipse cx="60" cy="13" rx="4.2" ry="7" transform="rotate(${a} 60 21)" fill="var(--rose)" opacity=".9"/>`;
  return `<svg viewBox="0 0 120 120" role="img" aria-label="${esc(S.settings.universe||'Monogram')}">${[0,72,144,216,288].map(petal).join('')}<circle cx="60" cy="21" r="2.4" fill="var(--gold)"/><path d="M36 38h48" stroke="currentColor" stroke-width="1" opacity=".6"/>
  <text x="60" y="84" text-anchor="middle" font-family="Cinzel, serif" font-size="${t.length>3?30:t.length>2?38:52}" font-weight="500" fill="currentColor" letter-spacing="${t.length>2?1:-6}">${esc(t)}</text><path d="M30 96c10 6 50 6 60 0M60 92v12" stroke="currentColor" stroke-width="1" fill="none" opacity=".6"/></svg>`;
}

/* ---------- Routing ---------- */
const VIEW_KEYS=NAV.flatMap(g=>g[1].map(i=>i[0]));
function parse(tok){S.tok=tok;const m=/^([ktcvame])-(.+)$/.exec(tok);if(m){S.view=m[1];S.id=m[2];}else{S.view=VIEW_KEYS.includes(tok)?tok:'anasayfa';S.id=null;}}
function go(tok){parse(tok);S.gq='';$('#gsearch').value='';$('#sres').hidden=true;render();window.scrollTo(0,0);try{if(location.hash.slice(1)!==tok)location.hash=tok;}catch(_){}}
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(t&&t!==S.tok){parse(t);S.gq='';$('#gsearch').value='';$('#sres').hidden=true;render();window.scrollTo(0,0);}});

/* ---------- Render ---------- */
function render(){
  const a=document.activeElement,keep=a&&a.id&&$('#view').contains(a)?{id:a.id,s:a.selectionStart,e:a.selectionEnd}:null;
  const log0=$('#chatlog'),chatAtEnd=!log0||log0.scrollHeight-log0.scrollTop-log0.clientHeight<80,chatTop=log0?log0.scrollTop:0;
  const drafts={};$('#view').querySelectorAll('textarea[id],select[id]:not([data-f]),input[id]:not([data-f]):not([type=file])').forEach(el=>drafts[el.id]=el.value);
  const cur=ROUTE_TAB[S.view]||S.view;
  $('#nav').innerHTML=NAV.map(([g,items],gi)=>`${gi===1?'<div class="side-sep"></div>':''}<div class="nav-g">${g?`<h4>${g}</h4>`:''}${items.map(([k,l,ic,cnt])=>`<a class="nav-i" href="#${k}" ${k===cur?'aria-current="page"':''}>${icon(ic)}${l}${cnt&&navCount(cnt)?`<b>${navCount(cnt)}</b>`:''}</a>`).join('')}</div>`).join('');
  $('#mono').innerHTML=monogram();
  $('#moon').innerHTML=icon(document.documentElement.dataset.mood==='light'?'sun':'moon');
  const pal=$('#palette');pal.innerHTML=icon(isGothic()?'candle':'sakura');pal.title=isGothic()?'Tema: Gotik (Sakura’ya geç)':'Tema: Sakura (Gotik’e geç)';pal.setAttribute('aria-label',pal.title);
  const myM=S.meId?byId(S.members,S.meId):null;
  $('#me').innerHTML=S.me&&S.me.id?`<img src="${esc(myM&&myM.photo?blob(myM.photo):S.me.avatarUrl)}" alt=""><span>${esc(dispName(S.meId))}<br><small class="muted">${S.canAdmin?'Düzenleyici':canW()?'Katkıda bulunan':'Okuyucu'}</small>${FB?` · <button class="linkish" style="font-size:13px" data-act="signout">Çıkış</button>`:''}</span>`:'';
  $('#mainwrap').classList.toggle('home',S.view==='anasayfa');
  let notice='';
  if(S.note)notice=`<div class="notice err">${esc(S.note)}</div>`;
  else if(S.slow&&S.loading)notice=`<div class="notice">Arşive henüz ulaşılamadı. Bağlantı kurulunca kayıtlar kendiliğinden gelecek.</div>`;
  $('#view').innerHTML=(S.view==='anasayfa'?'':notice)+viewHTML();
  $('#foot').innerHTML=footHTML();
  $('#overlay').innerHTML=S.reveal?revealHTML():'';
  if(S.gq)drawSearch();
  Object.entries(drafts).forEach(([id,v])=>{const el=document.getElementById(id);if(el&&v)el.value=v;});
  const log1=$('#chatlog');if(log1)log1.scrollTop=chatAtEnd?log1.scrollHeight:chatTop;
  if(keep){const e=document.getElementById(keep.id);if(e){e.focus();try{if(keep.s!=null)e.setSelectionRange(keep.s,keep.e);}catch(_){}}}
  resolveNames();
}
// Menu counts leave out records put on the shelf, so they match what each page lists.
function navCount(k){return (S[k]||[]).filter(r=>!r.archived).length;}
function footHTML(){
  const so=[['discord','Discord'],['youtube','YouTube'],['x','X'],['instagram','Instagram']].filter(([k])=>safeUrl(S.settings[k]));
  return `<div class="socials">${so.map(([k,l])=>`<a href="${esc(safeUrl(S.settings[k]))}" target="_blank" rel="noopener noreferrer" aria-label="${l}">${icon({x:'xlogo'}[k]||k)}</a>`).join('')}</div>
  <div class="foot-mid"><span class="orn" style="gap:8px">${icon('spark')}</span>${esc(S.settings.universe||'SEUL')}<span class="orn" style="gap:8px">${icon('spark')}</span></div>
  <div class="foot-r"></div>`;
}
function viewHTML(){
  const v=S.view;
  if(v==='k')return vChar();if(v==='t')return vComm();if(v==='c')return vCon();if(v==='v')return vCase();
  if(v==='a'||v==='m'||v==='e')return vAsset(ROUTES[v]);
  return ({anasayfa:vHome,karakterler:vProfiles,haneler:vComms,ooc:vChat,isiklar:vCelebs,yayinlar:vFeed,odul:vAwards,kartlar:vCards,siralar:vBoards,
    sorusturmalar:vCases,sozlesmeler:vCons,mulkler:()=>vAssets('props'),araclar:()=>vAssets('vehs'),esyalar:()=>vAssets('equip'),harita:vMap,kronik:vChron,
    kullanicilar:vMembers,kurallar:()=>vText('rules'),hakkimizda:()=>vText('about'),kayit:vAudit,ayarlar:vSystem}[v]||vHome)();
}
const loadingBlock=()=>`<div class="panel"><p class="muted" style="margin:0;font-style:italic">Mumlar yakılıyor, kayıtlar getiriliyor…</p></div>`;
function sel(id,key,all,opts,val){return `<select id="${id}" class="in" data-f="${key}" aria-label="${esc(all||key)}">${all!=null?`<option value="">${esc(all)}</option>`:''}${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===val?'selected':''}>${esc(l)}</option>`;}).join('')}</select>`;}
function newBtn(kind,label,preset,cls='primary'){return canW()?`<button class="btn ${cls}" data-act="new" data-kind="${kind}"${preset?` data-preset="${esc(JSON.stringify(preset))}"`:''}>${label}</button>`:'';}
function editBtn(kind,id,label='Düzenle',cls=''){return canW()?`<button class="btn ${cls}" data-act="edit" data-kind="${kind}" data-id="${esc(id)}">${label}</button>`:'';}
function head(eyebrow,title,count,btn){return `<div class="ph-head"><div class="t"><div class="eyebrow">${eyebrow}</div><h1 class="h-page">${title}</h1>${count!=null?`<span class="count">${count}</span>`:''}</div>${btn||''}</div>`;}
function emptyPanel(title,text,btn){return `<div class="panel empty"><h3>${title}</h3><p>${text}</p>${btn||''}</div>`;}
function noMatch(){return `<div class="panel"><p style="margin-top:0">Bu süzgeçlere uyan kayıt yok.</p><button class="btn" data-act="clear">Süzgeçleri temizle</button></div>`;}
function qchips(act,cur,list,count){return `<div class="qchips"><button class="qchip" data-act="${act}" data-v="" aria-pressed="${!cur}">Tümü<b>${count('')}</b></button>${list.map(v=>`<button class="qchip" data-act="${act}" data-v="${esc(v)}" aria-pressed="${cur===v}">${esc(v)}<b>${count(v)}</b></button>`).join('')}</div>`;}

/* ---------- Home ---------- */
function onlineList(){const seen=new Map();S.peers.filter(p=>p.kind==='viewer').forEach(p=>{const k=p.by||p.peer;if(!seen.has(k))seen.set(k,p);});return [...seen.values()];}
function dispName(id){const m=byId(S.members,id);return (m&&m.playerName)||uname(id);}
function avatarOf(id){const m=byId(S.members,id);if(m&&m.photo)return `<img src="${esc(blob(m.photo))}" alt="">`;const u=S.avatars[id];return u?`<img src="${esc(u)}" alt="">`:`<span>${esc(initials(dispName(id)))}</span>`;}
function vHome(){
  const st=S.settings,ol=onlineList();
  const evs=[...S.events].sort(byDate('date')).slice(0,4),logs=[...S.logs].sort(byDate('createdAt')).slice(0,5);

  const title=st.heroTitle||st.universe||'SEUL',cta=st.heroCta||'Karakterler';
  return `<section class="hero"><div class="hero-bg">${st.heroImage?`<img src="${esc(blob(st.heroImage))}" alt="">`:(isGothic()?HERO_GOTHIC:HERO_ART)}${PETALS}</div>
    <div class="hero-c">${st.heroEyebrow?`<div class="eyebrow orn">${esc(st.heroEyebrow)}</div>`:''}
      <h1 class="hero-t ${title.length<=6?'solo':''}">${esc(title)}${st.heroScript?`<span class="script">${esc(st.heroScript)}</span>`:''}</h1>
      <div class="orn">${icon('spark')}</div>
      ${st.heroText?`<p class="hero-p">${esc(st.heroText)}</p>`:''}
      <a class="cta" href="#karakterler">${esc(cta)} ${icon('arrow')}</a></div>
    <aside class="online" aria-label="Çevrimiçi kullanıcılar"><h3>Çevrimiçi Kullanıcılar<span><i class="dot"></i>${ol.length}</span></h3>
      ${ol.length?ol.slice(0,7).map(p=>`<div class="ou"><span class="av">${p.by?avatarOf(p.by):'<span>?</span>'}<i></i></span><span>${esc(p.by?uname(p.by):'Misafir')}</span>${p.isMe?'<small>sen</small>':''}</div>`).join(''):`<p style="margin:0;font-size:15px;color:#a898b8;font-style:italic">${ROOM?'Şu an kimse görünmüyor.':'Çevrimiçi listesi claude.ai’de açıldığında görünür.'}</p>`}</aside></section>
  <div class="home-panels">
    <section class="hp"><div class="hp-h">${icon('book')}<h2>Şehir Kroniği</h2><a href="#kronik">Kroniğe git ${icon('arrowr')}</a></div>
      ${evs.length?evs.map(e=>`<a class="hrow" href="#kronik" style="--pc:${esc(e.color||'#f4a6c8')}">${icon(EV_ICONS[e.icon]||'sakura')}<strong>${esc(e.title)}</strong><time>${fmtD(e.date)}</time></a>`).join(''):`<p class="empty-i" style="padding:14px 0">Kroniğe henüz bir olay düşmedi.</p>`}</section>
    <section class="hp"><div class="hp-h">${icon('candle')}<h2>Kulaktan Kulağa</h2><a href="#kronik">Hepsi ${icon('arrowr')}</a></div>
      ${logs.length?logs.map(l=>`<div class="whisper"><time>${esc(l.time||ago(l.createdAt))}</time><span class="wt-${esc(l.type||'')}">${esc(l.type||'')}</span> — ${esc(l.text)}</div>`).join(''):`<p class="empty-i" style="padding:14px 0">Sokaklar şimdilik sessiz.</p>`}</section>
  </div>
  ${latest.length?`<h2 class="sec-h">${icon('mask')}Son eklenen karakterler</h2><div class="grid">${latest.map(pcard).join('')}</div>`:''}
  <div class="strip"><span><b>${S.chars.filter(c=>!c.archived).length}</b>karakter</span><span><b>${S.comms.length}</b>hane</span><span><b>${S.cases.filter(v=>['Açık','Sürüyor'].includes(v.status)).length}</b>açık soruşturma</span><span><b>${S.cons.filter(k=>!k.archived&&['Açık','Üstlenildi','Sürüyor'].includes(k.status)).length}</b>açık sözleşme</span></div>`;
}

/* ---------- Characters ---------- */
function pcard(c){
  if(c.classified)return `<a class="port sealed" href="#k-${esc(c.id)}">${frame(`<span class="ph-none"><span class="seal-mark">${icon('sakura')}</span>MÜHÜRLÜ</span>`)}<div class="pname">Bilinmeyen</div><div class="pmeta"><span class="redact-bar" style="width:80px"></span></div></a>`;
  return `<a class="port" href="#k-${esc(c.id)}">${frame(photo(c),`<span class="fileno">${esc(c.fileNo||'')}</span>${c.locked?`<span class="lockb">${icon('lock')} Kilitli</span>`:''}${stamp(c.status)}`)}
    <div class="pname">${esc(c.name)}</div>${c.codename?`<div class="pcode">${esc(c.codename)}</div>`:''}
    <div class="pmeta">${lvChip(DANGER,c.threat)}${(c.types||[]).length?`<span>${esc(c.types.slice(0,2).join(' · '))}</span>`:''}</div></a>`;
}
function vProfiles(){
  const f=S.f,q=low(f.q);
  const pass=c=>{if(f.show==='raf'?!c.archived:c.archived)return false;if(f.type&&!(c.types||[]).includes(f.type))return false;
    if(f.status&&c.status!==f.status)return false;if(f.threat&&c.threat!==f.threat)return false;if(f.heat&&c.heat!==f.heat)return false;
    if(f.player&&c.player!==f.player)return false;if(f.org&&!commsOf(c.id).some(x=>x.o.id===f.org))return false;
    if(q&&![c.name,c.codename,c.aliases,c.fileNo,c.occupation,c.player].some(s=>low(s).includes(q)))return false;return true;};
  const list=S.chars.filter(pass).sort(sortName);
  const live=S.chars.filter(c=>!c.archived),types=allTypes();
  const filters=`<div class="filters"><input id="f-q" data-f="q" class="in" type="search" placeholder="İsim, lakap, kayıt no…" value="${esc(f.q)}" aria-label="Karakter ara">
    ${S.comms.length?sel('f-org','org','Tüm haneler',[...S.comms].sort(sortName).map(o=>[o.id,o.name]),f.org):''}
    ${sel('f-threat','threat','Tehlike',DANGER,f.threat)}${sel('f-heat','heat','Aranma',WANTED,f.heat)}${sel('f-status','status','Durum',STATUS,f.status)}
    ${players().length?sel('f-player','player','Oynayan',players(),f.player):''}${sel('f-show','show',null,[['','Galeridekiler'],['raf','Rafa kaldırılanlar']],f.show)}</div>`;
  let body;
  if(S.loading&&!S.chars.length)body=loadingBlock();
  else if(!S.chars.length)body=emptyPanel('Galeri henüz boş','Her karakter için bir portre as: lakap, tür (mafya, şarkıcı, polis…), tehlike ve aranma, geçmişi, bağları, serveti, galerisi ve belgeleri.',canW()?`<button class="btn primary" data-act="new" data-kind="chars">İlk portreyi as</button>`:'');
  else if(!list.length)body=noMatch();
  else body=`<div class="grid">${list.map(pcard).join('')}</div>`;
  return head('Portre galerisi','Karakterler',`${list.length} portre`,newBtn('chars','Yeni karakter'))+filters+
    (types.length?qchips('ftype',f.type,types,v=>v?live.filter(c=>(c.types||[]).includes(v)).length:live.length):'')+body;
}
function vChar(){
  const c=ch(S.id);if(!c)return missing('karakterler');
  if(c.locked&&!S.canAdmin)return `<div class="crumbs"><a href="#karakterler">Karakterler</a></div><div class="panel locked-sheet">${icon('lock')}<h2 class="h-page" style="font-size:30px">Kilitli sayfa</h2><p class="muted">Bu karakterin sayfası kilitli. Yalnızca düzenleyiciler açabilir.</p></div>`;
  if(c.classified&&!S.open[c.id])return `<div class="crumbs"><a href="#karakterler">Karakterler</a></div><div class="panel sealed-cover"><span class="seal-mark">${icon('sakura')}</span><h2 class="h-page" style="font-size:30px">Mühürlü portre</h2><p class="muted" style="max-width:44ch;margin:0">Bu karakterin kimliği galeride gizli tutuluyor. Mührü kırarsan sayfa yalnızca senin ekranında açılır.</p><button class="btn gold" data-act="unseal" data-id="${esc(c.id)}">Mührü kır</button></div>`;
  const cm=commsOf(c.id),posts=S.posts.filter(p=>p.charId===c.id).sort(byDate('date'));
  const vehs=S.vehs.filter(v=>v.ownerId===c.id),props=S.props.filter(p=>p.ownerId===c.id),eqs=S.equip.filter(e=>e.ownerId===c.id);
  const cases=S.cases.filter(v=>(v.involved||[]).some(i=>i.charId===c.id)||v.agentId===c.id);
  const cons=S.cons.filter(k=>k.targetId===c.id||k.assignedId===c.id||(k.suspects||[]).some(s=>s.charId===c.id));
  const awards=S.awards.filter(a=>a.winnerId===c.id);
  const rels=(c.relations||[]).filter(r=>r.charId||r.label);
  const back=S.chars.filter(o=>o.id!==c.id).flatMap(o=>(o.relations||[]).filter(r=>r.charId===c.id).map(r=>({o,label:r.label})));
  const gallery=(c.gallery||[]).filter(Boolean);
  const led=[['Durum',c.status||'Hayatta'],['Tehlike',c.threat||'Zararsız'],['Aranma',c.heat||'Temiz'],['Hanesi',null],['Oynayan',c.player],['Yaş',c.age],['Doğum günü',c.birthday],['Uyruk',c.nationality],['Boy',c.height],['Kilo',c.weight],['Meslek',c.occupation],['Yaşadığı yer',c.residence],['Diğer adları',c.aliases]];
  const ledHTML=led.map(([l,v])=>l==='Hanesi'?(cm.length?`<div><span>Hanesi</span><b>${cm.map(x=>`<a href="#t-${esc(x.o.id)}">${esc(x.o.name)}</a>${x.role?` <small class="muted">(${esc(x.role)})</small>`:''}`).join(', ')}</b></div>`:''):(v?`<div><span>${l}</span><b>${esc(v)}</b></div>`:'')).join('');
  const sec=(t,ic,body,cls='')=>`<section class="rs ${cls}"><h3>${icon(ic)}${t}</h3>${body}</section>`;
  const assetLinks=(arr,r,sub)=>arr.length?`<div class="links">${arr.map(x=>`<a class="lnk" href="#${r}-${esc(x.id)}"><span class="t"><strong>${esc(K[ROUTES[r]].nm(x))}</strong><small>${esc(sub(x)||'')}</small></span>${icon('arrow')}</a>`).join('')}</div>`:'';
  const rep=c.repScore!==undefined&&c.repScore!==''&&c.repScore!==null,rs=Math.max(-100,Math.min(100,+c.repScore||0));
  const theme=safeUrl(c.themeSong),ext=safeUrl(c.link);
  const scene=[['Ajans',c.agency],['Çıkış',c.debut],['Takipçi',c.followers]].filter(x=>x[1]);
  const parts=[
    c.bio&&sec('Geçmişi','book',`<div class="prose">${rich(c.bio)}</div>`),
    c.personality&&sec('Kişiliği','mask',rich(c.personality)),
    c.activities&&sec('Bilinen işleri','dagger',rich(c.activities)),
    (rels.length||back.length)&&sec('Bağları','rose',`<div class="links">${rels.map(r=>{const o=ch(r.charId);return o?`<a class="lnk" href="#k-${esc(o.id)}">${mini(o)}<span class="t"><strong>${esc(o.classified?'Bilinmeyen':o.name)}</strong><small>${esc(r.label||'bağlantılı')}</small></span>${icon('arrow')}</a>`:`<div class="lnk"><span class="t"><strong>${esc(r.label||'Silinmiş kayıt')}</strong></span></div>`;}).join('')}${back.map(b=>`<a class="lnk" href="#k-${esc(b.o.id)}">${mini(b.o)}<span class="t"><strong>${esc(b.o.classified?'Bilinmeyen':b.o.name)}</strong><small>${esc(b.label||'bağlantılı')} · onun sayfasında</small></span>${icon('arrow')}</a>`).join('')}</div>`),
    sec('Mülkiyeti','building',`<div class="two"><div><p class="eyebrow" style="margin:0 0 8px">Araçlar</p>${assetLinks(vehs,'a',v=>v.plate?'Plaka '+v.plate:v.year)||'<p class="empty-i">Kayıtlı araç yok.</p>'}</div><div><p class="eyebrow" style="margin:0 0 8px">Mülkler</p>${assetLinks(props,'m',p=>[p.kind,p.location].filter(Boolean).join(' · '))||'<p class="empty-i">Kayıtlı mülk yok.</p>'}</div></div>
      ${eqs.length?`<p class="eyebrow" style="margin:16px 0 8px">Eşyalar</p>${assetLinks(eqs,'e',e=>e.kind)}`:''}${canW()?`<div class="r-actions" style="margin-top:12px">${newBtn('vehs','Araç ekle',{ownerId:c.id},'small')}${newBtn('props','Mülk ekle',{ownerId:c.id},'small')}${newBtn('equip','Eşya ekle',{ownerId:c.id},'small')}</div>`:''}`),
    (c.banks||[]).length&&sec('Servet','gem',`<div class="tbl-wrap"><table class="tbl" style="min-width:440px"><thead><tr><th>Banka</th><th>Hesap</th><th>Bakiye</th><th>Not</th></tr></thead><tbody>${c.banks.map(b=>`<tr><td>${esc(b.bank)}</td><td class="num">${esc(b.account)}</td><td class="num">${esc(b.balance)}</td><td>${esc(b.note)}</td></tr>`).join('')}</tbody></table></div>`),
    (rep||c.repNotes||(c.repLevel&&c.repLevel!=='Adsız'))&&sec('Namı','crown',`<div style="display:flex;justify-content:space-between;gap:10px"><strong>${esc(c.repLevel||'Adsız')}</strong>${rep?`<span class="num">${rs>0?'+':''}${rs}</span>`:''}</div>${rep?`<div class="repbar" role="img" aria-label="Nam ${rs}"><i style="${rs>=0?`left:50%;width:${rs/2}%`:`left:${50+rs/2}%;width:${-rs/2}%;background:var(--rose)`}"></i></div>`:''}${c.repNotes?rich(c.repNotes):''}`),
    (scene.length||posts.length||isCeleb(c))&&sec('Sahnede','note',`${scene.length?`<div class="ledger" style="margin-bottom:14px">${scene.map(x=>`<div><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('')}</div>`:''}${posts.length?`<div class="feed">${posts.map(p=>clip(p,false)).join('')}</div>`:'<p class="empty-i">Henüz yayın yok.</p>'}${canW()?`<div style="margin-top:12px">${newBtn('posts','Yayın ekle',{charId:c.id},'small')}</div>`:''}`),
    awards.length&&sec('Ödülleri','trophy',`<ul style="margin:0;padding-left:20px">${awards.map(a=>`<li><span style="color:var(--gold)">${esc(a.category)}</span> · ${esc(a.ceremony)} ${esc(a.year||'')}${a.work?` · <em>${esc(a.work)}</em>`:''}</li>`).join('')}</ul>`),
    (cases.length||cons.length)&&sec('Adının geçtiği kayıtlar','case',`<div class="links">${cases.map(v=>`<a class="lnk" href="#v-${esc(v.id)}"><span class="t"><strong>${esc(v.title)}</strong><small>Soruşturma · ${esc(v.status||'')}</small></span>${icon('arrow')}</a>`).join('')}${cons.map(k=>`<a class="lnk" href="#c-${esc(k.id)}"><span class="t"><strong>${esc(K.cons.nm(k)||'Sözleşme')}</strong><small>Sözleşme · ${esc(k.status||'')}</small></span>${icon('arrow')}</a>`).join('')}</div>`),
    gallery.length&&sec(`Galeri · ${gallery.length}`,'images',`<div class="thumbs">${gallery.map((g,i)=>`<button class="thumb" data-act="lightbox" data-ids="${esc(gallery.join(','))}" data-i="${i}" aria-label="Fotoğraf ${i+1}">${img(g,'',' ')}</button>`).join('')}</div>`),
    (c.files||[]).length&&sec('Belgeler','file',filesBlock(c.files)),
    c.notes&&sec('Gizli notlar','eye',`<div class="notes">${rich(c.notes)}</div>`),
    (theme||ext)&&sec('Bağlantılar','link',`<div class="r-actions">${theme?playBtn(theme,`${c.name} · tema şarkısı`,'Tema şarkısını çal','btn gold'):''}${ext?`<a class="btn" href="${esc(ext)}" target="_blank" rel="noopener noreferrer">${icon('link')} Dış bağlantı ↗</a>`:''}</div>`)
  ].filter(Boolean);
  return `<div class="crumbs"><a href="#karakterler">Karakterler</a> / ${esc(c.name)}</div>
  <article class="book"><div class="book-l"><div style="position:relative;width:100%;display:grid;justify-items:center"><div class="candle"></div>${frame(photo(c),stamp(c.status))}</div>
      <div class="chips" style="justify-content:center">${typeChips(c)}</div>
      ${gallery.length?`<button class="btn" data-act="lightbox" data-ids="${esc(gallery.join(','))}" data-i="0">${icon('images')} Galeri · ${gallery.length}</button>`:''}</div>
    <div class="book-r">
      <div class="r-top"><div style="min-width:0"><div class="eyebrow">${esc(c.fileNo||'')}${c.fileNo?' · ':''}${esc(c.profileType||'Baş karakter')}${c.classif&&c.classif!=='Herkese açık'?' · '+esc(c.classif):''}</div>
        <h1 class="r-name">${esc(c.name)}</h1>${c.codename?`<div class="r-code">${esc(c.codename)}</div>`:''}</div>

      <div class="ledger">${ledHTML}</div>
      ${parts.join('')}
    </div></article>`;
}

function crest(o){return `<div class="crest" style="--oc:${esc(o.color||'#5a2d8c')}">${o.logo?img(o.logo,o.name,initials(o.name)):esc(initials(o.name))}</div>`;}

// Music and video links play in the corner player instead of opening a new tab (GitHub build only:
// claude.ai blocks embedding other sites, so there the button stays a plain link).
function embedOf(u){
  u=safeUrl(u);if(!u)return null;
  let m=/open\.spotify\.com\/(?:intl-[a-z-]+\/)?(track|album|playlist|episode|artist)\/([A-Za-z0-9]+)/.exec(u);
  if(m)return {src:`https://open.spotify.com/embed/${m[1]}/${m[2]}?utm_source=generator&theme=0`,h:m[1]==='track'||m[1]==='episode'?152:352,allow:'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture'};
  m=/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/.exec(u);
  if(m)return {src:`https://www.youtube-nocookie.com/embed/${m[1]}?autoplay=1&rel=0`,ratio:'16/9',allow:'autoplay; encrypted-media; picture-in-picture; fullscreen'};
  if(/^https?:\/\/(www\.|m\.)?soundcloud\.com\//.test(u))return {src:`https://w.soundcloud.com/player/?url=${encodeURIComponent(u)}&auto_play=true&color=%23f4a6c8&visual=false`,h:166,allow:'autoplay'};
  if(/\.(mp3|ogg|m4a|wav|aac)(\?|$)/i.test(u))return {audio:u};
  return null;
}
function playBtn(u,title,label,cls='btn small'){
  u=safeUrl(u);if(!u)return '';
  if(FB&&embedOf(u))return `<button class="${cls}" data-act="play" data-u="${esc(u)}" data-t="${esc(title)}">${icon('note')} ${esc(label)}</button>`;
  return `<a class="${cls}" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${icon('note')} ${esc(label)} ↗</a>`;
}
function openDock(u,title){
  const e=embedOf(u),d=$('#dock');if(!e){window.open(u,'_blank','noopener');return;}
  const body=e.audio?`<audio controls autoplay src="${esc(e.audio)}"></audio>`:`<iframe src="${esc(e.src)}" ${e.h?`height="${e.h}"`:`style="aspect-ratio:${e.ratio}"`} allow="${e.allow}" title="${esc(title)}" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
  d.innerHTML=`<div class="dock-h">${icon('note')}<strong>${esc(title)}</strong><a class="linkish" href="${esc(u)}" target="_blank" rel="noopener noreferrer" style="font-size:13px">Aç ↗</a><button class="moon" data-act="closedock" aria-label="Oynatıcıyı kapat" style="width:30px;height:30px">${icon('x')}</button></div>${body}`;
  d.hidden=false;
}

async function pull(){
  if(!S.meId||!DB)return;
  const P=pool(),limit=Math.max(1,+S.settings.dailyPulls||1),G=S.gacha||{},day=today(),used=G.day===day?(G.pulls||0):0;
  if(used>=limit||!P.length)return;
  const avail=Object.keys(RARITY).filter(r=>P.some(k=>k.rarity===r)),tot=avail.reduce((s,r)=>s+RARITY[r],0);
  let x=Math.random()*tot,rar=avail[0];for(const r of avail){if((x-=RARITY[r])<0){rar=r;break;}}
  const opts=P.filter(k=>k.rarity===rar),card=opts[Math.floor(Math.random()*opts.length)];
  const cards={...(G.cards||{})};S.revealNew=!cards[card.id];cards[card.id]=(cards[card.id]||0)+1;
  const btn=document.querySelector('[data-act="pull"]');if(btn)btn.disabled=true;$('#altar')?.classList.add('spin');
  try{await DB.doc(`data/users/${S.meId}/gacha`).set({day,pulls:used+1,cards,last:card.id,at:new Date().toISOString()});setTimeout(()=>{S.reveal=card;render();},800);}

}

async function backup(){
  const data={};Object.keys(K).forEach(k=>{if(K[k].col)data[K[k].col]=S[k];});data.meta=[{...S.settings,id:'settings'}];
  try{await DL.save({filename:`arsiv-yedek-${today()}.json`,data:JSON.stringify({app:'rp-arsiv',version:3,exportedAt:new Date().toISOString(),data},null,2)});toast('Yedek indirildi.');}
  catch(e){if(e&&e.code!=='declined')toast('Yedek indirilemedi. Yeniden dene.');}
}
async function restore(){
  const R=S.restore;if(!R||!R.ready)return;R.ready=false;let n=0;const total=R.count;
  const valid=new Set([...Object.values(K).map(k=>k.col).filter(Boolean),'meta']);valid.delete('members');
  try{for(const [col,docs] of Object.entries(R.data)){if(!valid.has(col)||!Array.isArray(docs))continue;
      for(const d of docs){if(!d||!d.id||!/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(d.id))continue;const {id,...body}=d;await DB.collection(col).doc(id).set(body);n++;if(n%10===0){R.msg=`Yükleniyor… ${n}/${total}`;render();}}}
    R.msg=`${n} kayıt geri yüklendi.`;audit('restore','settings',`${n} kayıt`);}
  catch(e){R.msg=`${n} kayıttan sonra durdu: ${errMsg(e)}`;}
  render();
}

/* ---------- Search ---------- */
function drawSearch(){
  const q=low(S.gq),box=$('#sres');if(!q){box.hidden=true;return;}
  const hits=[];
  S.chars.filter(c=>!c.classified&&[c.name,c.codename,c.aliases,c.fileNo].some(s=>low(s).includes(q))).forEach(c=>hits.push(['k-'+c.id,c.name,'Karakter']));
  S.comms.filter(o=>low(o.name).includes(q)).forEach(o=>hits.push(['t-'+o.id,o.name,'Hane']));
  S.cases.filter(v=>[v.title,v.caseNo].some(s=>low(s).includes(q))).forEach(v=>hits.push(['v-'+v.id,v.title,'Soruşturma']));
  S.cons.filter(k=>[K.cons.nm(k),k.conNo].some(s=>low(s).includes(q))).forEach(k=>hits.push(['c-'+k.id,K.cons.nm(k)||k.conNo,'Sözleşme']));
  S.props.filter(p=>low(p.name).includes(q)).forEach(p=>hits.push(['m-'+p.id,p.name,'Mülk']));
  S.vehs.filter(v=>[K.vehs.nm(v),v.plate].some(s=>low(s).includes(q))).forEach(v=>hits.push(['a-'+v.id,K.vehs.nm(v),'Araç']));
  S.equip.filter(e=>low(e.name).includes(q)).forEach(e=>hits.push(['e-'+e.id,e.name,'Eşya']));
  box.innerHTML=hits.length?hits.slice(0,10).map(h=>`<a href="#${esc(h[0])}"><span>${esc(h[1])}</span><small>${h[2]}</small></a>`).join(''):`<p class="empty-i" style="padding:12px 16px">“${esc(S.gq)}” için sonuç yok.</p>`;
  box.hidden=false;
}

function opts(list,v){const l=[...list];if(v&&!l.includes(v))l.push(v);return l.map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${esc(o)}</option>`).join('');}
function charOpts(v){return `<option value="">— Seç —</option>${[...S.chars].sort(sortName).map(c=>`<option value="${esc(c.id)}" ${c.id===v?'selected':''}>${esc(c.name)}${c.codename?` (${esc(c.codename)})`:''}</option>`).join('')}${v&&!ch(v)?`<option value="${esc(v)}" selected>Silinmiş kayıt</option>`:''}`;}
function commOpts(v){return `<option value="">— Yok —</option>${[...S.comms].sort(sortName).map(o=>`<option value="${esc(o.id)}" ${o.id===v?'selected':''}>${esc(o.name)}</option>`).join('')}`;}
function conOpts(v){return `<option value="">— Yok —</option>${S.cons.map(k=>`<option value="${esc(k.id)}" ${k.id===v?'selected':''}>${esc((k.conNo?k.conNo+' · ':'')+(K.cons.nm(k)||'Sözleşme'))}</option>`).join('')}`;}
function prevHTML(id){const r=S.form&&S.form.rec||{};const pos=S.form&&S.form.kind==='chars'?` style="object-position:${$('#e-photoX')?.value??(r.photoX??50)}% ${$('#e-photoY')?.value??(r.photoY??25)}%"`:'';return id?`<img src="${esc(blob(id))}" alt="Seçilen görsel"${pos}>`:`<span class="ph-none">GÖRSEL YOK</span>`;}
const IMG_TYPES=/^image\/(png|jpeg|webp|gif)$/;
const FILE_TYPES={'application/pdf':1,'image/png':1,'image/jpeg':1,'image/webp':1,'image/gif':1,'video/mp4':1,'video/webm':1,'text/plain':1,'text/markdown':1,'text/csv':1,'application/json':1};

function imgLink(u){u=String(u||'').trim();const m=/^https?:\/\/(?:www\.|m\.)?imgur\.com\/([A-Za-z0-9]{5,10})(?:[?#].*)?$/.exec(u);return m?`https://i.imgur.com/${m[1]}.jpg`:u;}
function upCtl(k,mode){
  const accept=mode==='files'?'.pdf,.png,.jpg,.jpeg,.webp,.gif,.mp4,.webm,.txt,.md,.csv,.json':'image/png,image/jpeg,image/webp,image/gif';
  const file=ASSETS?`<input type="file" class="in" id="up-${k}" data-up="${k}" data-mode="${mode}" accept="${accept}" ${mode!=='image'?'multiple':''} aria-label="Dosya seç">`:(FB?'':`<p class="muted">Bu hesapla dosya yüklenemiyor. Arşivin sahibi ya da düzenleyicileri yükleyebilir.</p>`);
  // External links only display outside claude.ai, whose page rules block images from other sites.
  const url=FB?`<div style="display:flex;gap:6px;flex-wrap:wrap"><input class="in" id="url-${k}" type="url" placeholder="${mode==='files'?'ya da belge / görsel bağlantısı yapıştır':'ya da imgur vb. fotoğraf bağlantısı yapıştır'}" style="flex:1 1 200px;min-width:0" aria-label="Bağlantı yapıştır"><button type="button" class="btn small" data-act="addurl" data-k="${k}" data-mode="${mode}">Bağlantıyı ekle</button></div>`:'';
  return file+url;}
function fieldHTML(f,v){
  if(f.sec)return `<div class="fsec">${esc(f.sec)}${f.hint?`<small>${esc(f.hint)}</small>`:''}</div>`;
  const id='e-'+f.k,w=f.w||'',lab=`<span>${esc(f.l)}${f.req?' *':''}</span>`,M=S.form.media;
  switch(f.t){
    case 'area':return `<label class="fld ${w}">${lab}<textarea id="${id}" class="in" rows="${f.rows||4}">${esc(v??'')}</textarea></label>`;
    case 'select':return `<label class="fld ${w}">${lab}<select id="${id}" class="in">${opts(f.o,v)}</select></label>`;
    case 'char':return `<label class="fld ${w}">${lab}<select id="${id}" class="in">${charOpts(v)}</select></label>`;
    case 'comm':return `<label class="fld ${w}">${lab}<select id="${id}" class="in">${commOpts(v)}</select></label>`;
    case 'contract':return `<label class="fld ${w}">${lab}<select id="${id}" class="in">${conOpts(v)}</select></label>`;
    case 'player':return `<label class="fld ${w}">${lab}<input id="${id}" class="in" list="dl-players" value="${esc(v??'')}" placeholder="NPC / atanmamış"><datalist id="dl-players">${players().map(p=>`<option value="${esc(p)}">`).join('')}</datalist></label>`;
    case 'check':return `<label class="fld check ${w}"><input id="${id}" type="checkbox" ${v?'checked':''}>${esc(f.l)}</label>`;
    case 'color':return `<label class="fld ${w}">${lab}<input id="${id}" type="color" value="${esc(/^#[0-9a-f]{6}$/i.test(v||'')?v:'#5a2d8c')}"></label>`;
    case 'number':return `<label class="fld ${w}">${lab}<input id="${id}" class="in" type="number" value="${esc(v??'')}"></label>`;
    case 'range':return `<label class="fld ${w}">${lab}<input id="${id}" type="range" min="0" max="100" step="1" value="${esc(v!=null&&v!==''?v:f.def)}" data-pos="${f.k}" style="width:100%;accent-color:var(--rose)"></label>`;

    case 'image':{const val=M[f.k]||'';return `<div class="fld ${w}" id="fw-${f.k}">${lab}<div class="photo-ed"><div class="pe-prev ${f.wide?'wide':''}">${prevHTML(val)}</div><div class="pe-ctl">${upCtl(f.k,'image')}<p class="muted">${FB?'PNG, JPG ya da WEBP; büyük fotoğraflar otomatik küçültülür.':'PNG, JPG, WEBP ya da GIF, en fazla 20 MB.'}</p>${val?`<button type="button" class="btn small" data-act="rmmedia" data-k="${f.k}" style="justify-self:start">Görseli kaldır</button>`:''}<p class="muted" id="msg-${f.k}" aria-live="polite"></p></div></div></div>`;}
    case 'gallery':{const list=M[f.k]||[];return `<div class="fld ${w}" id="fw-${f.k}">${lab}${list.length?`<div class="mlist">${list.map((g,i)=>`<div class="mitem"><img src="${esc(blob(g))}" alt=""><button type="button" class="btn small x" data-act="rmmedia" data-k="${f.k}" data-i="${i}" aria-label="Fotoğrafı kaldır">✕</button></div>`).join('')}</div>`:''}<div class="pe-ctl">${upCtl(f.k,'gallery')}<p class="muted" id="msg-${f.k}" aria-live="polite">Birden fazla fotoğraf seçebilirsin.</p></div></div>`;}

function nextNo(kind){
  const conf={chars:['fileNo',(S.settings.prefix||'RP').toUpperCase()],cases:['caseNo','S-'+new Date().getFullYear()],cons:['conNo','SZ'],vehs:['regNo','AR'],props:['regNo','MK'],equip:['regNo','ES']}[kind];
  if(!conf)return '';const [k,pre]=conf;let max=0;
  S[kind].forEach(r=>{const m=/(\d+)\s*$/.exec(r[k]||'');if(m)max=Math.max(max,+m[1]%10000);});
  return `${pre}-${String(max+1).padStart(3,'0')}`;
}

function collect(fields){
  const o={};
  for(const f of fields){
    if(f.sec)continue;const el=document.getElementById('e-'+f.k);
    if(f.t==='check')o[f.k]=!!(el&&el.checked);
    else if(f.t==='types'){const t=[...document.querySelectorAll('#ed [data-type]')].filter(x=>x.checked).map(x=>x.dataset.type);o.types=[...new Set([...t,...splitList($('#e-types-new')?.value)])];}
    else if(f.t==='image'||f.t==='gallery'||f.t==='files')o[f.k]=S.form.media[f.k];
    else if(f.t==='map'){const x=parseFloat(String($('#e-mapX').value).replace(',','.')),y=parseFloat(String($('#e-mapY').value).replace(',','.'));o.mapX=isNaN(x)?null:Math.max(0,Math.min(100,x));o.mapY=isNaN(y)?null:Math.max(0,Math.min(100,y));}
    else if(f.t==='number'){const n=parseFloat(el?el.value:'');o[f.k]=isNaN(n)?null:n;}
    else if(f.t==='range')o[f.k]=el?+el.value:f.def;
    else if(f.t==='rows')o[f.k]=[...el.querySelectorAll('.row')].map(row=>{const r={};row.querySelectorAll('[data-sub]').forEach(i=>r[i.dataset.sub]=i.value.trim());return r;}).filter(r=>Object.values(r).some(Boolean));
    else o[f.k]=(el?el.value:'').trim();
  }
  const pin=document.getElementById('e-pinned');if(pin)o.pinned=pin.checked;
  return o;
}

  if(kind==='cons'&&!data.targetId&&!data.targetName){showErr('Bir hedef seç ya da hedefin adını yaz.');return;}
  if(kind==='cards'&&!data.charId&&!data.name){showErr('Bir karakter seç ya da kart adı yaz.');return;}

async function upload(input){
  const k=input.dataset.up,mode=input.dataset.mode,files=[...input.files],msg=$('#msg-'+k);if(!files.length||!S.form)return;
  const extType=n=>({pdf:'application/pdf',txt:'text/plain',md:'text/markdown',csv:'text/csv',json:'application/json',mp4:'video/mp4',webm:'video/webm',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif'})[String(n).split('.').pop().toLowerCase()]||'';
  S.form.uploading++;let ok=0,fail='';
  for(const file of files){
    const type=FILE_TYPES[file.type]?file.type:extType(file.name);
    if(mode!=='files'&&!IMG_TYPES.test(type)){fail='Yalnızca PNG, JPG, WEBP ya da GIF seç.';continue;}
    if(mode==='files'&&!FILE_TYPES[type]){fail=`${file.name}: bu dosya türü desteklenmiyor.`;continue;}
    if(file.size>20*1024*1024){fail=`${file.name}: dosya 20 MB’tan büyük.`;continue;}
    if(msg)msg.textContent=`Yükleniyor: ${file.name}…`;
    try{const r=await ASSETS.upload(file,{type});S.blobUrls[r.id]=r.url;if(!S.form)break;
      if(mode==='image')S.form.media[k]=r.id;else if(mode==='gallery')S.form.media[k].push(r.id);else S.form.media[k].push({id:r.id,name:file.name,type});ok++;}
    catch(err){fail=({too_large:'Dosya çok büyük.',unsupported_type:'Bu dosya türü desteklenmiyor.',quota_or_state:'Arşivin dosya alanı doldu.',rate_limited:'Çok sık yükleme yapıldı, biraz bekleyip yeniden dene.',not_granted:'Bu hesapla dosya yüklenemiyor.'})[err&&err.code]||'Yüklenemedi. Yeniden dene.';}
  }
  if(!S.form)return;S.form.uploading--;refreshMedia(k);queueDraft();
  const m2=$('#msg-'+k);if(m2)m2.textContent=fail||(ok?`${ok} dosya yüklendi. Kaydet’e basmayı unutma.`:'');
}
