});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#sres').hidden){$('#sres').hidden=true;return;}if(!$('#lb').hidden){$('#lb').hidden=true;return;}if(S.reveal){S.reveal=null;render();return;}if(S.form){closeModal();return;}}
  if(!$('#lb').hidden&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){LB.i=(LB.i+(e.key==='ArrowRight'?1:-1)+LB.ids.length)%LB.ids.length;drawLB();}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('redact')){e.preventDefault();e.target.classList.toggle('shown');}
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('#ed')&&e.target.tagName==='INPUT')e.preventDefault();
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.target.id==='chat-text'){e.preventDefault();sendMsg();}
});
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.dataset.ph!=null&&!t.dataset.failed){t.dataset.failed='1';const s=document.createElement('span');if(t.closest('.mini'))s.textContent=t.dataset.ph;else{s.className='ph-none';s.innerHTML=`<b>${esc(t.dataset.ph)}</b>GÖRSEL YOK`;}t.replaceWith(s);}},true);

async function resolveNames(){
  if(!USER)return;
  const ids=[...new Set([...S.chars,...S.audit,...S.members].flatMap(r=>[r.createdBy,r.by,r.id&&S.members.includes(r)?r.id:null]).concat(S.peers.map(p=>p.by)).filter(Boolean))].filter(id=>!S.asked.has(id));
  if(!ids.length)return;ids.forEach(i=>S.asked.add(i));
  try{const ps=await USER.profiles(ids);let changed=false;ids.forEach(id=>{const p=ps[id];if(p){if(p.name){S.names[id]=p.name;changed=true;}if(p.avatarUrl){S.avatars[id]=p.avatarUrl;changed=true;}}});if(changed)render();}catch(_){}
}

/* ---------- Boot ---------- */
async function init(){
  parse(location.hash.slice(1));render();
  if(!window.claude||!window.claude.use){S.loading=false;S.note='Bu sayfa claude.ai üzerinde açıldığında ortak arşive bağlanır.';render();return;}
  const [db,user,assets,dl,room]=await Promise.all(['db','user','assets','downloads','room'].map(n=>claude.use(n)));
  DB=db;USER=user;ASSETS=assets;DL=dl;ROOM=room;
  if(user){try{S.canWrite=await user.can('data.write');S.canAdmin=await user.canEdit();S.me=await user.me();S.meId=S.me.id;if(S.meId){if(S.me.name)S.names[S.meId]=S.me.name;S.avatars[S.meId]=S.me.avatarUrl;}}catch(_){}}
  let queued=false;const soon=()=>{if(queued)return;queued=true;setTimeout(()=>{queued=false;render();},30);};
  if(room){try{room.onPeers(c=>{S.peers=[...c.peers];if(S.view==='anasayfa'||S.view==='kullanicilar'||S.view==='ooc')soon();},()=>{});room.presence({here:true}).catch(()=>{});}catch(_){}}
  if(!db){S.loading=false;S.note='Arşive bağlanılamadı. Kayıtları görmek için claude.ai hesabınla giriş yapman gerekir.';render();return;}
  const timer=setTimeout(()=>{if(S.loading){S.slow=true;render();}},10000);
  const kinds=Object.keys(K).filter(k=>K[k].col),total=kinds.length+1;
  const mark=k=>{S.loaded.add(k);if(S.loaded.size>=total&&S.loading){S.loading=false;S.slow=false;clearTimeout(timer);}};
  kinds.forEach(kind=>db.collection(K[kind].col).onSnapshot(snap=>{S[kind]=snap.docs.map(d=>({...d.data(),id:d.id}));if(!snap.metadata.fromCache)mark(kind);soon();},
    err=>{mark(kind);if(err&&err.code!=='revoked')S.note='Kayıtların bir kısmı yüklenemedi. Sayfayı yeniden açmayı dene.';soon();}));
  if(FB&&S.canAdmin)db.collection('keys').onSnapshot(s=>{S.access=s.docs.map(d=>({...d.data(),id:d.id}));if(S.view==='ayarlar')soon();},()=>{});
  db.collection('chat').orderBy('at','desc').limit(200).onSnapshot(s=>{S.chat=s.docs.map(d=>({...d.data(),id:d.id}));if(S.view==='ooc'||S.view==='anasayfa')soon();},()=>{});
  db.doc('meta/settings').onSnapshot(s=>{S.settings=s.exists?s.data():{};if(!s.metadata.fromCache)mark('settings');soon();},()=>{mark('settings');soon();});
  if(S.meId){
    db.doc(`data/users/${S.meId}/gacha`).onSnapshot(s=>{S.gacha=s.exists?s.data():null;soon();},()=>{});
    if(S.canWrite!==false)setTimeout(async()=>{const m=byId(S.members,S.meId);const now=new Date().toISOString();if(m&&m.lastSeen&&Date.now()-Date.parse(m.lastSeen)<3600e3)return;
      try{const b={...(m||{firstSeen:now}),lastSeen:now};delete b.id;await db.collection('members').doc(S.meId).set(b);}catch(_){}},4000);
  }
}
window.__rerender=()=>render();
init();
</script>
